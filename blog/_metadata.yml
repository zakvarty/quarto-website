# options apply to all posts in this folder
format:
  html:
    toc: true
    toc-title: Contents
    toc-location: left
    grid:
      margin-width: 350px
reference-location: margin
citation-location: margin

# freeze computational output
freeze: auto

# Make a big title block
title-block-banner: false

# long dates
date-format: long

# smooth scroll
smooth-scroll: true

# Default author
author:
  - name: Zak Varty
    url: https://www.zakvarty.com/
    #affiliation: Teaching Fellow in Statistics @ Imperial College London
    #affiliation-url: https://www.imperial.ac.uk/statistics/

# citation
citation: true

# Enable CC licence appendix
license: "CC BY"

bibliography: ../library.bib
